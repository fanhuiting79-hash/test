<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>底部CTA</title>
<style>
  :root{--brand-grad:linear-gradient(135deg,#4f7cff 0%,#7a5cff 100%);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:0 28px;}
  .wrap{max-width:1280px;margin:0 auto;}
  .bottom-cta{background:linear-gradient(135deg,#3b6bff 0%,#6c4bff 50%,#9355ff 100%);color:#fff;text-align:center;padding:72px 40px;border-radius:28px;margin-top:56px;position:relative;overflow:hidden;box-shadow:0 32px 80px rgba(79,92,255,.3),inset 0 1px 0 rgba(255,255,255,.2);}
  .bottom-cta::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 200px at 75% -20%,rgba(255,255,255,.25),transparent 60%),radial-gradient(400px 200px at 15% 130%,rgba(0,220,200,.2),transparent 60%);pointer-events:none;}
  .bottom-cta h3{font-size:30px;font-weight:900;margin-bottom:12px;position:relative;z-index:1;letter-spacing:-.8px}
  .bottom-cta p{opacity:.92;margin-bottom:32px;position:relative;z-index:1;font-size:15.5px}
  .bottom-cta .btn{position:relative;z-index:1;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:15px 32px;border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;border:0;transition:all .4s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;text-decoration:none;}
  .btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 12px 32px rgba(79,124,255,.32),inset 0 1px 0 rgba(255,255,255,.2);}
  .btn-primary::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);transition:left .7s ease;}
  .btn-primary:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 20px 48px rgba(79,124,255,.42)}
  .btn-primary:hover::after{left:150%}
  .btn-lg{padding:16px 36px;font-size:15.5px}
  footer{text-align:center;color:#8a94b2;font-size:12.5px;padding:36px 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bottom-cta">
    <h3>立即在你的数据上跑起来</h3>
    <p>一键应用模板到 EasyBI 工作区，绑定你的数据集即可复用。</p>
    <a class="btn btn-primary btn-lg" href="https://easybi.jd.com/preview/1785968?system=bi-new" target="_blank" rel="noopener">一键应用此模板 →</a>
  </div>
</div>
<footer>EasyBI 模板市场 · 用户留存分析 · 示例数据仅供演示</footer>
</body>
</html>
