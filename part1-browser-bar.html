<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>浏览器工具栏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f6fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .frame-bar{display:flex;align-items:center;gap:8px;padding:14px 20px;background:linear-gradient(180deg,#f8f9fd,#eef1f8);border:1px solid #e9edf5;border-bottom:none;border-radius:20px 20px 0 0;}
  .frame-bar i{width:12px;height:12px;border-radius:50%;display:block}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .url{flex:1;margin-left:12px;background:#fff;border:1px solid #e9edf5;border-radius:8px;font-size:12.5px;color:#8a94b2;padding:6px 16px;}
</style>
</head>
<body>
<div class="frame-bar">
  <i class="r"></i><i class="y"></i><i class="g"></i>
  <div class="url">easybi.jd.com/preview/1788529</div>
</div>
</body>
</html>
